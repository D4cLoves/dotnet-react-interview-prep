name: Daily Learning Commit

on:
  schedule:
    # Запуск каждый день в 06:00 UTC (09:00 по МСК)
    - cron: '0 6 * * *'
  workflow_dispatch: # Кнопка для ручной проверки/запуска на странице Actions

jobs:
  daily-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run daily generator script
        run: python generate_daily.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "docs: add daily interview Q&A (C# / ASP.NET / React)" || exit 0
          git push
